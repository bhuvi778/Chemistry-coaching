<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Force Reload - Ace2Examz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        h1 {
            margin: 0 0 20px 0;
            font-size: 2em;
        }
        .status {
            font-size: 1.2em;
            margin: 20px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        .btn {
            background: #4CAF50;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #45a049;
            transform: scale(1.05);
        }
        .btn-secondary {
            background: #2196F3;
        }
        .btn-secondary:hover {
            background: #0b7dda;
        }
        .progress {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            overflow: hidden;
            margin: 20px 0;
        }
        .progress-bar {
            height: 100%;
            background: #4CAF50;
            width: 0%;
            transition: width 0.3s;
        }
        .step {
            margin: 10px 0;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            text-align: left;
        }
        .step.done {
            background: rgba(76, 175, 80, 0.3);
        }
        .check {
            color: #4CAF50;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Cache Clearing in Progress</h1>
        <p>Clearing all cached data to load the latest version...</p>
        
        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div id="steps">
            <div class="step" id="step1">⏳ Clearing browser cache...</div>
            <div class="step" id="step2">⏳ Removing service workers...</div>
            <div class="step" id="step3">⏳ Clearing IndexedDB...</div>
            <div class="step" id="step4">⏳ Clearing local storage...</div>
        </div>
        
        <div class="status" id="status">Please wait...</div>
        
        <button class="btn" id="reloadBtn" style="display: none;" onclick="window.location.href='/'">
            Go to Home
        </button>
    </div>

    <script>
        let progress = 0;
        const progressBar = document.getElementById('progressBar');
        const status = document.getElementById('status');
        const reloadBtn = document.getElementById('reloadBtn');
        
        function updateProgress(value) {
            progress = value;
            progressBar.style.width = progress + '%';
        }
        
        function markStepDone(stepId) {
            const step = document.getElementById(stepId);
            step.classList.add('done');
            step.innerHTML = '<span class="check">✅</span>' + step.innerHTML.substring(2);
        }
        
        async function clearEverything() {
            try {
                // Step 1: Clear cache
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    await Promise.all(cacheNames.map(name => caches.delete(name)));
                }
                markStepDone('step1');
                updateProgress(25);
                
                await new Promise(resolve => setTimeout(resolve, 500));
                
                // Step 2: Unregister service workers
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(registrations.map(reg => reg.unregister()));
                }
                markStepDone('step2');
                updateProgress(50);
                
                await new Promise(resolve => setTimeout(resolve, 500));
                
                // Step 3: Clear IndexedDB
                if ('indexedDB' in window) {
                    const dbs = await indexedDB.databases();
                    dbs.forEach(db => {
                        indexedDB.deleteDatabase(db.name);
                    });
                }
                markStepDone('step3');
                updateProgress(75);
                
                await new Promise(resolve => setTimeout(resolve, 500));
                
                // Step 4: Clear storage
                localStorage.clear();
                sessionStorage.clear();
                markStepDone('step4');
                updateProgress(100);
                
                status.innerHTML = '<strong>✅ All cache cleared successfully!</strong>';
                reloadBtn.style.display = 'inline-block';
                
                // Auto redirect after 2 seconds
                setTimeout(() => {
                    window.location.href = '/?v=' + Date.now();
                }, 2000);
                
            } catch (error) {
                console.error('Error clearing cache:', error);
                status.innerHTML = '⚠️ Some items couldn\'t be cleared. Please manually clear browser data.';
                reloadBtn.style.display = 'inline-block';
            }
        }
        
        // Start clearing automatically
        clearEverything();
    </script>
</body>
</html>
