<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clearing Cache...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            max-width: 600px;
            width: 90%;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status {
            margin-top: 20px;
            font-size: 16px;
            font-weight: bold;
        }
        .log {
            margin-top: 20px;
            font-size: 12px;
            text-align: left;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 5px;
            max-height: 300px;
            overflow-y: auto;
        }
        .log-item {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid;
        }
        .success { 
            color: #4ade80; 
            border-color: #4ade80;
        }
        .error { 
            color: #fb7185; 
            border-color: #fb7185;
        }
        .info {
            color: #60a5fa;
            border-color: #60a5fa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 Clearing All Caches...</h1>
        <div class="spinner" id="spinner"></div>
        <div class="status" id="status">Initializing cache clearing...</div>
        <div class="log" id="log"></div>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const logEl = document.getElementById('log');
        const spinnerEl = document.getElementById('spinner');
        
        function log(message, type = 'info') {
            const item = document.createElement('div');
            item.className = `log-item ${type}`;
            item.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logEl.appendChild(item);
            logEl.scrollTop = logEl.scrollHeight;
            console.log(message);
        }

        async function clearAllCaches() {
            let clearedCount = 0;

            try {
                // 1. Unregister ALL service workers
                log('Checking for service workers...', 'info');
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    log(`Found ${registrations.length} service worker(s)`, 'info');
                    
                    for (let registration of registrations) {
                        await registration.unregister();
                        log(`✓ Unregistered service worker: ${registration.scope}`, 'success');
                        clearedCount++;
                    }
                    
                    if (registrations.length === 0) {
                        log('No service workers found', 'info');
                    }
                }

                // 2. Clear Cache Storage API
                log('Clearing Cache Storage API...', 'info');
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    log(`Found ${cacheNames.length} cache(s)`, 'info');
                    
                    for (let cacheName of cacheNames) {
                        await caches.delete(cacheName);
                        log(`✓ Deleted cache: ${cacheName}`, 'success');
                        clearedCount++;
                    }
                    
                    if (cacheNames.length === 0) {
                        log('No caches found', 'info');
                    }
                }

                // 3. Clear localStorage
                log('Clearing localStorage...', 'info');
                const localStorageSize = localStorage.length;
                localStorage.clear();
                log(`✓ Cleared ${localStorageSize} localStorage item(s)`, 'success');
                clearedCount++;

                // 4. Clear sessionStorage
                log('Clearing sessionStorage...', 'info');
                const sessionStorageSize = sessionStorage.length;
                sessionStorage.clear();
                log(`✓ Cleared ${sessionStorageSize} sessionStorage item(s)`, 'success');
                clearedCount++;

                // 5. Clear IndexedDB
                log('Clearing IndexedDB databases...', 'info');
                if ('indexedDB' in window) {
                    try {
                        const databases = await indexedDB.databases();
                        for (let db of databases) {
                            indexedDB.deleteDatabase(db.name);
                            log(`✓ Deleted IndexedDB: ${db.name}`, 'success');
                            clearedCount++;
                        }
                        if (databases.length === 0) {
                            log('No IndexedDB databases found', 'info');
                        }
                    } catch (e) {
                        log(`IndexedDB clearing not fully supported: ${e.message}`, 'error');
                    }
                }

                // 6. Clear cookies for this domain
                log('Clearing cookies...', 'info');
                const cookies = document.cookie.split(';');
                for (let cookie of cookies) {
                    const eqPos = cookie.indexOf('=');
                    const name = eqPos > -1 ? cookie.substr(0, eqPos).trim() : cookie.trim();
                    document.cookie = name + '=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';
                }
                log(`✓ Cleared ${cookies.length} cookie(s)`, 'success');
                clearedCount++;

                // Success!
                statusEl.textContent = `✅ Successfully cleared ${clearedCount} cache layers!`;
                spinnerEl.style.display = 'none';
                log(`\n🎉 All caches cleared! Redirecting to homepage...`, 'success');

                // Wait 2 seconds then redirect with cache-busting
                setTimeout(() => {
                    const timestamp = new Date().getTime();
                    window.location.href = `/?nocache=${timestamp}`;
                }, 2000);

            } catch (error) {
                statusEl.textContent = '❌ Error clearing caches';
                spinnerEl.style.display = 'none';
                log(`Error: ${error.message}`, 'error');
                log('Please manually clear your browser cache:', 'error');
                log('Chrome: Ctrl+Shift+Delete', 'info');
                log('Firefox: Ctrl+Shift+Delete', 'info');
            }
        }

        // Start clearing process immediately
        clearAllCaches();
    </script>
</body>
</html>
