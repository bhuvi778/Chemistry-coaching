<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test - Concept Notes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .chapter {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 20px;
            margin: 15px 0;
        }
        .chapter-name {
            font-size: 24px;
            font-weight: bold;
            color: #06b6d4;
        }
        .subject {
            color: #9333ea;
            font-size: 14px;
        }
        .topic {
            background: #333;
            padding: 10px;
            margin: 10px 0;
            border-left: 3px solid #06b6d4;
        }
        button {
            background: #06b6d4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0891b2;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success { background: #065f46; }
        .error { background: #991b1b; }
        .info { background: #1e40af; }
    </style>
</head>
<body>
    <h1>🧪 API Test - Concept Notes</h1>
    <p>This page tests the API directly to verify the data is correct.</p>
    
    <button onclick="fetchData()">🔄 Fetch Chapters (No Cache)</button>
    
    <div id="status"></div>
    <div id="results"></div>

    <script>
        async function fetchData() {
            const statusDiv = document.getElementById('status');
            const resultsDiv = document.getElementById('results');
            
            statusDiv.innerHTML = '<div class="status info">🔍 Fetching data from API...</div>';
            resultsDiv.innerHTML = '';
            
            try {
                // Add timestamp to bypass cache
                const timestamp = new Date().getTime();
                const url = `/api/concept-notes/admin/all?t=${timestamp}`;
                
                console.log('Fetching from:', url);
                
                const response = await fetch(url, {
                    cache: 'no-cache',
                    headers: {
                        'Cache-Control': 'no-cache',
                        'Pragma': 'no-cache'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                console.log('Received data:', data);
                
                statusDiv.innerHTML = `<div class="status success">✅ Success! Received ${data.length} chapters</div>`;
                
                // Display chapters
                let html = '';
                data.forEach((chapter, index) => {
                    html += `
                        <div class="chapter">
                            <div class="chapter-name">${index + 1}. ${chapter.chapterName || 'MISSING CHAPTER NAME'}</div>
                            <div class="subject">📚 Subject: ${chapter.subject || 'MISSING SUBJECT'}</div>
                            <div>🎯 Exam Type: ${chapter.examType || 'All'}</div>
                            <div>📝 Description: ${chapter.description || 'No description'}</div>
                            <div>🖼️ Thumbnail: ${chapter.thumbnailUrl ? 'Yes' : 'No'}</div>
                            <div>📊 Topics: ${chapter.topics ? chapter.topics.length : 0}</div>
                            ${chapter.topics && chapter.topics.length > 0 ? `
                                <div style="margin-top: 10px;">
                                    <strong>Topics:</strong>
                                    ${chapter.topics.map((topic, i) => `
                                        <div class="topic">
                                            ${i + 1}. ${topic.title || 'Untitled'}
                                            ${topic.images && topic.images.length > 0 ? ` (${topic.images.length} images)` : ''}
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}
                        </div>
                    `;
                });
                
                resultsDiv.innerHTML = html;
                
            } catch (error) {
                console.error('Error:', error);
                statusDiv.innerHTML = `<div class="status error">❌ Error: ${error.message}</div>`;
            }
        }
        
        // Auto-fetch on load
        window.addEventListener('load', fetchData);
    </script>
</body>
</html>
