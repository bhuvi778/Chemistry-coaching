    /* ---- Quill editor height fix (override Quill's height:100%) ---- */
    /* Scoped to wrapper classes only — prevents conflicting with inline height styles */

    /* Force the ReactQuill root .quill div to expand to content */

    .quill-dark-text > .quill,
    .quill-wrapper > .quill,
    .quill-editor-black-text > div,
    .quill-dark-text > div,
    .quill-wrapper > div {
      height: auto !important;
      display: block !important;
      position: relative !important;
    }

    .quill-editor-black-text .ql-container,
    .quill-dark-text .ql-container,
    .quill-wrapper .ql-container {
      height: auto !important;
      position: relative !important;
    }
    .quill-editor-black-text .ql-editor,
    .quill-dark-text .ql-editor,
    .quill-wrapper .ql-editor {
      height: auto !important;
      min-height: 150px !important;
      padding: 12px 15px !important;

    }

    /* Ensure wrapper divs have proper block flow and spacing */
    .quill-wrapper,
    .quill-editor-black-text,
    .quill-dark-text {
      display: block !important;
      overflow: visible !important;
      position: relative !important;
      min-height: 220px !important;
    }

    /* Cursor fix — ensure clicking shows a text caret */
    .quill-wrapper .ql-editor,
    .quill-editor-black-text .ql-editor,
    .quill-dark-text .ql-editor {
      cursor: text !important;
      caret-color: currentColor !important;
    }
    .quill-wrapper .ql-editor {
      caret-color: #ffffff !important;
    }
    .quill-editor-black-text .ql-editor,
    .quill-dark-text .ql-editor {
      caret-color: #000000 !important;
    }
    /* White bg for light editors (quill-editor-black-text, quill-dark-text) */

    .quill-dark-text .ql-container {
      background-color: #ffffff !important;
    }
    .quill-editor-black-text .ql-editor,
    .quill-dark-text .ql-editor {
      background-color: #ffffff !important;
      color: #000000 !important;
    }
    /* Dark bg for dark-theme editors (quill-wrapper) */
    .quill-wrapper .ql-container {
      background-color: #111827 !important;
    }
    .quill-wrapper .ql-editor {
      background-color: #111827 !important;
      color: #ffffff !important;
    }
    /* Ensure placeholder is positioned correctly */
    .quill-editor-black-text .ql-editor.ql-blank::before,
    .quill-dark-text .ql-editor.ql-blank::before,
    .quill-wrapper .ql-editor.ql-blank::before {
      top: 12px !important;
      left: 15px !important;
    }
